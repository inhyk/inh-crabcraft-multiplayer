name: Collision bake
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  collision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
      - run: pnpm install --frozen-lockfile
      - run: node tools/bake-collision.mjs --check
      - run: node --test tests/collision-bake.test.mjs
